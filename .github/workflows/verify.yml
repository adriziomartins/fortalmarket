name: Verificação do MVP estático

on:
  pull_request:
  push:
    branches:
      - main
      - feat/mvp-v0.1-prototipo

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Versão Node disponível
        run: node --version
      - name: Verificar sintaxe
        run: node --check app.js
      - name: Testar estrutura do protótipo
        run: node --test tests/smoke.test.cjs
      - name: Gerar artefatos de publicação
        run: bash scripts/build.sh
      - name: Verificar saída
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test -s dist/_headers
